[package]
name = "capitus-struxis-debugger"
readme = "README.md"
version = "0.1.0"
edition = "2024"

[features]
# Enables integration tests that require the local test_data/catalog dataset.
catalog-integration-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
capitus-struxis = { workspace = true }
capitus-strategy = { workspace = true }
nautilus-persistence = { workspace = true }
nautilus-model = { workspace = true }
nautilus-backtest = { workspace = true }
nautilus-common = { workspace = true }
nautilus-execution = { workspace = true }
nautilus-trading = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }

[dev-dependencies]
nautilus-model = { workspace = true , features = ["test-support"] }

[lints]
workspace = true
